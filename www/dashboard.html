<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>PDA Solusi POS</title>
    <link rel="stylesheet" type="text/css" href="styles/bootstrap.css">
    <link rel="stylesheet" type="text/css" href="styles/style.css">
    <link rel="stylesheet" type="text/css" href="styles/modern-ui.css">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800,900|Roboto:300,300i,400,400i,500,500i,700,700i,900,900i&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="fonts/css/all.css">
    <link rel="stylesheet" type="text/css" href="fonts/css/solid.css">
    <link rel="apple-touch-icon" sizes="180x180" href="app/icons/icon-192x192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">
</head>

<body class="theme-light">

    <div id="preloader">
        <div class="spinner-border color-highlight" role="status"></div>
    </div>

    <div id="page">

        <!-- header and footer bar go here-->
        <div class="header header-fixed header-auto-show header-logo-app">
            <a href="#" data-back-button class="header-title header-subtitle">Solusi POS</a>
            <a href="#" data-toggle-theme class="header-icon header-icon-2 show-on-theme-dark"><i class="fas fa-sun"></i></a>
            <a href="#" data-toggle-theme class="header-icon header-icon-2 show-on-theme-light"><i class="fas fa-moon"></i></a>

        </div>
        <div id="footer-bar" class="footer-bar-5">
            <a href="#" onclick="javascript:menu('po-receiving.html');"><i class="fa fa-truck color-highlight"></i><span>PO</span></a>
            <a href="#" onclick="javascript:menu('cek-harga.html');"><i class="fa-solid fa-barcode color-highlight"></i><span>Harga</span></a>
            <a href="#" onclick="javascript:menu('dashboard.html');"><i class="fa fa-cubes color-highlight"></i><span>Home</span></a>
            <a href="#" onclick="javascript:menu('label-harga.html');"><i class="fa-solid fa-clipboard-question color-highlight"></i><span>Label</span></a>
            <a href="#" onclick="logoutMe();"><i class="fa fa-sign-out-alt color-red-dark"></i><span>Logout</span></a>
        </div>

        <div class="page-content">

            <div class="page-title page-title-large mb-4">
                <h2 class="font-900">Dashboard</h2>
            </div>
            
            <div class="card card-style bg-highlight mb-4">
                <div class="content py-3">
                    <div class="d-flex">
                        <div class="align-self-center">
                            <h1 class="color-white mb-0 font-24">Halo,</h1>
                            <h2 class="color-white font-700 mb-0" id="namalogin"></h2>
                        </div>
                        <div class="ms-auto align-self-center">
                            <i class="fa fa-user-circle color-white font-40 opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row text-center mb-0 mx-2">
                <a href="#" onclick="javascript: menu('po-receiving.html');" class="col-6 p-2">
                    <div class="card card-style dashboard-card m-0 py-4">
                        <i class="fa fa-truck font-30 mb-2"></i>
                        <h5 class="font-600 mb-0">PO Receiving</h5>
                        <p class="font-10 opacity-50 mb-0">Penerimaan Barang</p>
                    </div>
                </a>
                <a href="#" onclick="javascript: menu('stock-opname.html');" class="col-6 p-2">
                    <div class="card card-style dashboard-card m-0 py-4">
                        <i class="fa fa-cubes font-30 mb-2 color-green-dark"></i>
                        <h5 class="font-600 mb-0">Stock Opname</h5>
                        <p class="font-10 opacity-50 mb-0">Update Stok</p>
                    </div>
                </a>
                <a href="#" onclick="javascript: menu('cek-harga.html');" class="col-6 p-2">
                    <div class="card card-style dashboard-card m-0 py-4">
                        <i class="fa fa-barcode font-30 mb-2 color-blue-dark"></i>
                        <h5 class="font-600 mb-0">Cek Harga</h5>
                        <p class="font-10 opacity-50 mb-0">Scan Produk</p>
                    </div>
                </a>
                <a href="#" onclick="javascript: menu('label-harga.html');" class="col-6 p-2">
                    <div class="card card-style dashboard-card m-0 py-4">
                        <i class="fa fa-clipboard-question font-30 mb-2 color-yellow-dark"></i>
                        <h5 class="font-600 mb-0">Label Harga</h5>
                        <p class="font-10 opacity-50 mb-0">Cetak Label</p>
                    </div>
                </a>
            </div>
        </div>
        <script src="scripts/jquery.min.js"></script>
        <script type="text/javascript">
            cekLogin();

            function menu(url) {
                window.location.href = url;
            }

            function cekLogin() {
                var token = localStorage.getItem('tokenpda');
                if (token == null || token == undefined) {
                    window.location.href = 'index.html';
                } else {
                    return true;
                }
            }

            function sqlerror(error) {
                showNotification('Error: ' + JSON.stringify(error), 'error');
            }


            function logoutMe() {
                localStorage.setItem('tokenpda', '');
                localStorage.setItem('user', '');
                localStorage.setItem('first', '');
                localStorage.setItem('last', '');
                localStorage.setItem('toko', '');
                localStorage.setItem('id', '');
                window.location.href = 'index.html';
            }
            var first = localStorage.getItem('first');
            var last = localStorage.getItem('last');
            $("#namalogin").html(first + ' ' + last + '!');
        </script>
        <script type="text/javascript" src="scripts/bootstrap.min.js"></script>
        <script type="text/javascript" src="scripts/custom.js"></script>

</body>
